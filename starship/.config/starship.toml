format = """
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$python\
$lua\
$nodejs\
$golang\
$haskell\
$rust\
$ruby\
$aws\
$docker_context\
$jobs\
$cmd_duration\
$status\
$line_break\
$character"""

add_newline = true
fill.symbol = ' '

[character]
success_symbol = '[\$](bold #E2DD61)'
error_symbol = '[\$](bold #FF5555)'

[directory]
truncation_length = 2
truncation_symbol = '…/'
truncate_to_repo = true
style = 'bold #BD93F9'
read_only = ' 🔒'
read_only_style = '#FF5555'

[git_branch]
symbol = '🌿 '
style = '#FFB86C'

# Shows REBASING, MERGING, BISECTING and friends. An interrupted rebase is
# otherwise invisible until a command fails for no obvious reason.
[git_state]
format = '[⚠️ $state( $progress_current/$progress_total)]($style) '
style = 'bold #FF5555'

[git_status]
style = '#3dcf62'
conflicted = '💥'
ahead = '⬆️${count}'
behind = '⬇️${count}'
diverged = '↕️⬆️${ahead_count}⬇️${behind_count}'
untracked = '❓${count}'
stashed = '📦${count}'
modified = '📝${count}'
staged = '➕${count}'
renamed = '🔀${count}'
deleted = '🗑️${count}'

[python]
symbol = '🐍 '
format = '[$symbol$version]($style) '
style = '#E2DD61'
pyenv_version_name = true
pyenv_prefix = ''

[lua]
symbol = '🌙 '
format = '[$symbol$version]($style) '
style = '#BD93F9'

[nodejs]
symbol = '💚 '
format = '[$symbol$version]($style) '
style = '#3dcf62'

[golang]
symbol = '🐹 '
format = '[$symbol$version]($style) '
style = '#00B5DC'

[haskell]
symbol = '🎩 '
format = '[$symbol$version]($style) '
style = '#BD93F9'

[rust]
symbol = '🦀 '
format = '[$symbol$version]($style) '
style = '#FFB86C'

[ruby]
symbol = '💎 '
format = '[$symbol$version]($style) '
style = '#FF5555'

[aws]
symbol = '☁️ '
style = '#E2DD61'
# Optional group, so an inactive profile hides the module instead of
# printing a bare cloud with an empty expiry.
format = '([$symbol$profile]($style) )'

[docker_context]
symbol = '🐳 '
style = '#00B5DC'
format = '[$symbol$context]($style) '
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']

[jobs]
symbol = '⚙️ '
style = '#FF5555'
number_threshold = 1
format = '[$symbol$number]($style) '

[cmd_duration]
min_time = 500
format = '[⏱️ $duration]($style) '
style = '#bac2db'

[status]
disabled = false
symbol = '💥 '
format = '[$symbol$common_meaning$signal_name$maybe_int]($style) '
style = 'bold #FF5555'
