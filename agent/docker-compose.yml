# A personal agent: Claude Code running in tmux, reached through a Telegram bot.
# Self-contained, so Dokploy can deploy it from this repo or as a raw compose.
#
# Set in Dokploy's Environment tab:
#   TELEGRAM_BOT_TOKEN       from @BotFather
#   TELEGRAM_USER_ID         your numeric id, from @userinfobot. Allowlisted on first boot
#   CLAUDE_CODE_OAUTH_TOKEN  optional, from `claude setup-token`. Without it, /login once
#   CLAUDE_ARGS              optional extra flags, such as --dangerously-skip-permissions
#
# Reach the session from the container terminal with `tmux attach -t agent`,
# and leave it with ctrl+b d.

services:
  agent:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        RUN apt-get update \
         && apt-get install -y --no-install-recommends ca-certificates curl git jq tmux \
         && rm -rf /var/lib/apt/lists/*
        # the channel plugins are Bun scripts
        COPY --from=oven/bun:1-debian /usr/local/bin/bun /usr/local/bin/bun
        USER node
        RUN curl -fsSL https://claude.ai/install.sh | bash \
         && mkdir -p /home/node/.claude /home/node/workspace
        WORKDIR /home/node/workspace
    restart: unless-stopped
    init: true
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_ARGS: ${CLAUDE_ARGS:-}
      # keeps .claude.json inside the volume along with the rest
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # a channel server on the newer MCP handshake does not register, and
      # nothing else in this container needs that handshake
      MCP_PROTOCOL_NEGOTIATION: legacy
      PATH: /home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      TZ: ${TZ:-America/Sao_Paulo}
      LANG: C.UTF-8
      TERM: xterm-256color
    volumes:
      - claude:/home/node/.claude
      - workspace:/home/node/workspace
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cfg=$$CLAUDE_CONFIG_DIR

        # skip the first-run wizard and the folder trust dialog, which no channel can answer
        [ -f "$$cfg/.claude.json" ] || echo '{}' > "$$cfg/.claude.json"
        jq '.hasCompletedOnboarding = true | .projects["/home/node/workspace"].hasTrustDialogAccepted = true' \
          "$$cfg/.claude.json" > "$$cfg/.claude.json.tmp"
        mv "$$cfg/.claude.json.tmp" "$$cfg/.claude.json"

        # allowlist your account up front, so no pairing code is ever handed out
        access=$$cfg/channels/telegram/access.json
        if [ -n "$$TELEGRAM_USER_ID" ] && [ ! -f "$$access" ]; then
          mkdir -p "$$(dirname "$$access")"
          jq -n --arg id "$$TELEGRAM_USER_ID" '{dmPolicy: "allowlist", allowFrom: [$$id], groups: {}}' > "$$access"
        fi

        claude plugin marketplace add anthropics/claude-plugins-official >/dev/null 2>&1 || true
        claude plugin install telegram@claude-plugins-official

        tmux new-session -d -s agent -x 200 -y 50 \
          "claude --channels plugin:telegram@claude-plugins-official $$CLAUDE_ARGS"
        # the container lives as long as the session, so /exit restarts it
        while tmux has-session -t agent 2>/dev/null; do sleep 10; done

volumes:
  claude:
  workspace:
