onboarding = false

[keys]
prefix = "ctrl+space"
new_tab          = ["prefix+c", "cmd+t"]
close_pane       = ["prefix+x", "cmd+w"]
split_vertical   = ["prefix+v", "cmd+d"]
split_horizontal = ["prefix+minus", "cmd+shift+d"]
cycle_pane_next     = ["prefix+tab", "cmd+]"]
cycle_pane_previous = ["prefix+shift+tab", "cmd+["]
focus_pane_left  = ["prefix+h", "ctrl+alt+h", "prefix+left"]
focus_pane_down  = ["prefix+j", "ctrl+alt+j", "prefix+down"]
focus_pane_up    = ["prefix+k", "ctrl+alt+k", "prefix+up"]
focus_pane_right = ["prefix+l", "ctrl+alt+l", "prefix+right"]
previous_tab = ["prefix+p", "ctrl+alt+[", "prefix+shift+left", "cmd+shift+["]
next_tab     = ["prefix+n", "ctrl+alt+]", "prefix+shift+right", "cmd+shift+]"]
switch_tab       = ["prefix+1..9", "ctrl+alt+1..9"]
switch_workspace = "cmd+1..9"

[theme]
name = "dracula"
auto_switch = false

[theme.custom]
accent = "#BD93F9"
panel_bg = "#0E131B"
sidebar_bg = "#0E131B"
active_row_bg = "#282A36"
selection_bg = "#44475A"
surface0 = "#21222C"
surface1 = "#282A36"
surface_dim = "#191A21"
overlay0 = "#44475A"
overlay1 = "#465276"
text = "#CDD0DD"
subtext0 = "#bac2db"
mauve = "#BD93F9"
blue = "#BD93F9"
teal = "#00B5DC"
green = "#3dcf62"
yellow = "#E2DD61"
peach = "#FFB86C"
red = "#FF5555"

[ui]
prompt_new_tab_name = false
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

status_indicators = "symbols"
[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"

# BEGIN jhochenbaum.hunkdiff — managed by `setup-keys`; edit via the plugin, not by hand
[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "hunk: review staged changes"
# END jhochenbaum.hunkdiff
