onboarding = false

[keys]
prefix = "ctrl+space"

[theme]
name = "dracula"
auto_switch = false

[theme.custom]
accent = "#BD93F9"
panel_bg = "#0E131B"
sidebar_bg = "#0E131B"
active_row_bg = "#282A36"
selection_bg = "#44475A"
surface0 = "#21222C"
surface1 = "#282A36"
surface_dim = "#191A21"
overlay0 = "#44475A"
overlay1 = "#465276"
text = "#CDD0DD"
subtext0 = "#bac2db"
mauve = "#BD93F9"
blue = "#BD93F9"
teal = "#00B5DC"
green = "#3dcf62"
yellow = "#E2DD61"
peach = "#FFB86C"
red = "#FF5555"

[ui]
prompt_new_tab_name = false
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"

# BEGIN jhochenbaum.hunkdiff — managed by `setup-keys`; edit via the plugin, not by hand
[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "hunk: review staged changes"
# END jhochenbaum.hunkdiff
